name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build release files
        run: |
          npm run build
          npx electron-builder --publish never
      - name: Publish release files
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -eq 'latest.yml' -or $_.Extension -in '.exe','.blockmap' } | ForEach-Object { $_.FullName }
          if ($assets.Count -lt 3) { throw "Expected installer, block map, and latest.yml." }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
